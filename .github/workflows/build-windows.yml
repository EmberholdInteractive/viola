name: Windows-Installer bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install-Skripte manuell ausfuehren
        shell: cmd
        run: |
          if not exist "node_modules\electron\dist\electron.exe" node node_modules\electron\install.js
          if not exist "node_modules\ffmpeg-static\ffmpeg.exe" node node_modules\ffmpeg-static\install.js
      - name: Version aus Laufnummer setzen
        shell: bash
        run: npm version 0.3.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Installer bauen und als Release veröffentlichen
        shell: bash
        run: |
          npx electron-builder --win nsis --publish always > build.log 2>&1 || { (grep -i -m6 "error\|failed\|cannot" build.log; tail -n 4 build.log) | while IFS= read -r l; do echo "::error::${l:0:240}"; done; exit 1; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: Viola-Setup
          path: dist/Viola-Setup-*.exe
      - name: Log bei Fehler auf Branch buildlog speichern
        if: failure()
        shell: bash
        run: |
          mkdir ../lg && cp build.log ../lg/build.log && cd ../lg
          git init -q && git checkout -q -b buildlog && git add build.log
          git -c user.name=ci -c user.email=ci@example.com commit -q -m log
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" buildlog
